{% extends "base.html" %}
{% block title %}New Prediction | Heart Disease Prediction{% endblock %}

{% block head %}
<style>
    .form-card { width: 820px; max-width: 96%; padding: 26px 30px; }
    .form-card h2 { text-align: center; margin-bottom: 4px; }
    .form-card .hint { text-align: center; color: #cfd8dc; font-size: 13px; margin-bottom: 18px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 12.5px; color: #cfd8dc; margin-bottom: 4px; }
    .field input, .field select {
        width: 100%; padding: 9px 10px; border: none; border-radius: 8px; outline: none;
        background: rgba(255,255,255,0.15); color: #fff; font-size: 14px;
    }
    .field input::placeholder { color: #b9c2c7; }
    .field input:focus, .field select:focus { background: rgba(255,255,255,0.28); }
    .field select option { color: #111; background: #eaf1f5; }
    .predict-btn {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: #ff4d4d;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.reset-btn {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: #221afff6;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.predict-btn:hover {
    background: #ff1a1a;
}

.reset-btn:hover {
    background: #221afff6;
}


</style>
{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Enter Patient Data</h2>
    <p class="hint">Fill all fields, then click Predict.</p>

    <form action="/predict" method="post">
        <div class="grid">

            <div class="field full">
                <label>Patient Name</label>
                <input type="text" name="name" placeholder="e.g. Rizwan Ali" required>
            </div>

            <div class="field">
                <label>Age (years)</label>
                <input type="number" name="age" min="1" max="120" placeholder="e.g. 54" required>
            </div>

            <div class="field">
                <label>Sex</label>
                <select name="sex" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="field">
                <label>Chest Pain Type</label>
                <select name="cp" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="1">Typical Angina</option>
                    <option value="2">Atypical Angina</option>
                    <option value="3">Non-Anginal Pain</option>
                    <option value="4">Asymptomatic</option>
                </select>
            </div>

            <div class="field">
                <label>Resting BP (mm Hg)</label>
                <input type="number" name="trestbps" min="50" max="260" placeholder="e.g. 130" required>
            </div>

            <div class="field">
                <label>Cholesterol (mg/dl)</label>
                <input type="number" name="chol" min="80" max="700" placeholder="e.g. 240" required>
            </div>

            <div class="field">
                <label>Fasting Sugar &gt; 120</label>
                <select name="fbs" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="1">True</option>
                    <option value="0">False</option>
                </select>
            </div>

            <div class="field">
                <label>Resting ECG</label>
                <select name="restecg" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="0">Normal</option>
                    <option value="1">ST-T Abnormality</option>
                    <option value="2">LV Hypertrophy</option>
                </select>
            </div>

            <div class="field">
                <label>Max Heart Rate</label>
                <input type="number" name="thalach" min="60" max="230" placeholder="e.g. 150" required>
            </div>

            <div class="field">
                <label>Exercise Angina</label>
                <select name="exang" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="field">
                <label>Oldpeak (ST Depr.)</label>
                <input type="number" step="0.1" name="oldpeak" min="0" max="10" placeholder="e.g. 1.4" required>
            </div>

            <div class="field">
                <label>Slope of ST</label>
                <select name="slope" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="1">Upsloping</option>
                    <option value="2">Flat</option>
                    <option value="3">Downsloping</option>
                </select>
            </div>

            <div class="field">
                <label>Major Vessels (CA)</label>
                <select name="ca" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>

            <div class="field">
                <label>Thalassemia</label>
                <select name="thal" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="3">Normal</option>
                    <option value="6">Fixed Defect</option>
                    <option value="7">Reversible Defect</option>
                </select>
            </div>

        </div>
        <button type="submit" class="predict-btn">Predict</button>
        <button type="reset" class="reset-btn">Reset</button>
    </form>
</div>
{% endblock %}
